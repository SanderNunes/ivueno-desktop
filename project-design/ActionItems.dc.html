<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<title>Ivuenu · Tarefas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E6A58}a:hover{color:#17554A}
button,input,select{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #1E6A58;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F7F5F2; color: #1F1D1A; font-family: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-wrap: wrap">
<aside style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: #EFECE7; border-right: 1px solid #E2DDD5; padding: 16px 12px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#1E6A58"></rect><path d="M8 10h12M8 14h9M8 18h5" stroke="#FFFEFC" stroke-width="2" stroke-linecap="round"></path></svg><span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em">ivuenu</span></div>
<a href="Start.dc.html" style="height: 40px; border-radius: 8px; background: #1E6A58; color: #FFFEFC; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFEFC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nova reunião</a>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 2px">
<a href="Home.dc.html" style="height: 36px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F1D1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57524B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
<a href="ActionItems.dc.html" aria-current="page" style="height: 36px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F1D1A; background: #FFFEFC; font-weight: 600; box-shadow: 0 1px 2px rgba(31,29,26,.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E6A58" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"></rect><path d="m8 12 3 3 5-6"></path></svg><span style="flex: 1">Tarefas</span><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #1E6A58; color: #FFFEFC; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{openCount}}</span></a>
<a href="Search.dc.html" style="height: 36px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F1D1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57524B" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4.2-4.2"></path></svg>Pesquisar</a>
</nav>
<div style="margin-top: auto; padding-top: 16px; border-top: 1px solid #E2DDD5"><a href="Settings.dc.html" style="height: 36px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F1D1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57524B" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Definições</a></div>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 4vw, 56px) 56px">
<div style="max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Tarefas</h1><span style="color: #57524B">{{openCount}} em aberto, de 4 reuniões. Só as que são tuas ou estão sem dono.</span></div>
<div role="radiogroup" aria-label="Mostrar" style="display: flex; padding: 3px; background: #EFECE7; border-radius: 8px; gap: 2px">
<button role="radio" aria-checked="true" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 0; background: #FFFEFC; box-shadow: 0 1px 2px rgba(31,29,26,.10); font-size: 13px; font-weight: 600; color: #1F1D1A">Minhas</button>
<button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; font-size: 13px; color: #57524B">Todas</button>
<button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; font-size: 13px; color: #57524B">Concluídas</button>
</div>
</header>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><a href="Detail.dc.html" style="font-size: 15px; font-weight: 700; color: #1F1D1A; text-decoration: none">{{g.title}}</a><span style="font-size: 12px; color: #57524B">{{g.meta}}</span></div>
<sc-for list="{{g.items}}" as="k" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; background: #FFFEFC; border: 1px solid #E2DDD5; border-radius: 8px">
<input type="checkbox" checked="{{k.done}}" onChange="{{k.toggle}}" aria-label="{{k.aria}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #1E6A58">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="{{k.textStyle}}">{{k.text}}</span><span style="display: flex; gap: 12px; font-size: 12px; color: #57524B; flex-wrap: wrap"><span>{{k.owner}}</span><span>{{k.due}}</span></span></div>
<span style="display: flex; gap: 2px"><button aria-label="Editar tarefa" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#57524B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button><button aria-label="Ocultar tarefa" style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#57524B" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.6 9.6 0 0 1 12 6c5 0 8.5 4.5 9 6-.3.8-1.2 2.3-2.6 3.6M6.5 7.6C4.5 9 3.3 11 3 12c.5 1.5 4 6 9 6 1.6 0 3-.4 4.2-1.1"></path></svg></button></span>
</div>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: {} }; }
  renderVals() {
    const s = this.state;
    const defs = [
      ['Revisão de preços Q4', 'hoje · 10:30', [['Enviar a nova lista de preços', 'Carla Neto', 'sexta-feira'], ['Avisar o suporte', 'Sem dono', 'Sem prazo']]],
      ['Chamada com cliente: Banco Exemplo', '16/10 · 16:00', [['Enviar proposta revista do SLA', 'Ana Silva (tu)', '23/10'], ['Confirmar contactos técnicos do banco', 'Ana Silva (tu)', 'próxima semana']]],
      ['Planeamento do projeto fibra óptica', '19/10 · 11:00', [['Pedir orçamento para 12 km de cabo', 'Ana Silva (tu)', 'fim do mês'], ['Rever mapa de Luanda Sul com o Domingos', 'Sem dono', 'Sem prazo']]],
      ['Reunião semanal da equipa', '16/10 · 09:00', [['Partilhar o relatório semanal', 'Ana Silva (tu)', 'segunda-feira']]]
    ];
    let open = 0;
    const groups = defs.map(([title, meta, items], gi) => ({ title, meta: meta + ' · abrir reunião', items: items.map(([text, owner, due], i) => {
      const key = gi + '-' + i; const d = !!s.done[key]; if (!d) open++;
      return { text, owner, due, done: d, aria: 'Concluir: ' + text, textStyle: d ? 'font-size: 15px; text-decoration: line-through; color: #57524B' : 'font-size: 15px', toggle: () => this.setState({ done: { ...s.done, [key]: !d } }) };
    }) }));
    return { groups, openCount: open };
  }
}
</script>
</body>
</html>
